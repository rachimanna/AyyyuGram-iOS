name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Telegram-iOS source
        uses: actions/checkout@v4
        with:
          repository: 'TelegramMessenger/Telegram-iOS'
          submodules: recursive

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Install Bazel
        run: brew install bazel

      - name: Build IPA
        run: |
          python3 build-system/Make/Make.py \
            --action=build \
            --buildConfig=build-system/appstore-candidate.json \
            --configuration=releaseIPA

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-iOS-IPA
          path: build/artifacts/*.ipa
